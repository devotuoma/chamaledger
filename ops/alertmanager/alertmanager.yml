route:
  receiver: responder
  group_by: [alertname]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 30m

receivers:
  - name: responder
    webhook_configs:
      - url: http://responder:8100/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /tmp/responder-token
