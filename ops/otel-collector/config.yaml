receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s
  # Second layer of protection. The application should never send these at all.
  attributes/strip-sensitive:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.request.header.x-ops-token
        action: delete
      - key: url.query
        action: delete
      - key: http.url
        action: delete
  transform/scrub-phones:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_all_patterns(attributes, "value", "\\+[1-9][0-9]{7,14}", "[REDACTED]")
      - context: spanevent
        statements:
          - replace_all_patterns(attributes, "value", "\\+[1-9][0-9]{7,14}", "[REDACTED]")
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "\\+[1-9][0-9]{7,14}", "[REDACTED]")
          - replace_all_patterns(attributes, "value", "\\+[1-9][0-9]{7,14}", "[REDACTED]")

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    metric_expiration: 30m
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [attributes/strip-sensitive, transform/scrub-phones, batch]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      processors: [attributes/strip-sensitive, transform/scrub-phones, batch]
      exporters: [otlp/tempo]
