name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 3s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - run: pip install -e 'backend[dev]'
      - name: Lint
        run: ruff check backend scripts
      - name: Unit and integration tests on Postgres
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: pytest -q

  responder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - run: pip install -e 'responder[dev]'
      - run: ruff check responder
      - run: pytest -q
        working-directory: responder

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit test the alert rules
        run: >-
          docker run --rm -v "$PWD/ops/prometheus/rules:/rules:ro" --entrypoint promtool
          prom/prometheus:v2.55.1 test rules /rules/journey.test.yml
      - name: Validate the Alertmanager config
        run: >-
          docker run --rm -v "$PWD/ops/alertmanager:/config:ro" --entrypoint amtool
          prom/alertmanager:v0.27.0 check-config /config/alertmanager.yml

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the whole system with one command
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Smoke test through the frontend
        run: python3 scripts/smoke.py http://localhost:8080 | tee smoke.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The journey works in a real browser
        run: |
          python3 -m venv .e2e
          .e2e/bin/pip install --quiet playwright==1.49.1
          .e2e/bin/playwright install --with-deps chromium
          .e2e/bin/python scripts/e2e_browser.py http://localhost:8080 e2e-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore
      - name: One request can be followed across metrics, logs and traces
        run: python3 scripts/verify_telemetry.py
      - name: Grafana serves the provisioned dashboard
        run: curl -fsS http://localhost:3000/api/dashboards/uid/chamaledger-journey | grep -q "record a contribution"
      - name: Data survives a restart
        run: |
          member_id=$(grep -o 'member_id=[0-9]*' smoke.txt | cut -d= -f2)
          docker compose down
          docker compose up --detach --wait --wait-timeout 180
          python3 scripts/smoke.py http://localhost:8080 --verify-persisted "$member_id"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
