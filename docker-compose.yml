name: chamaledger

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chamaledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chamaledger}
      POSTGRES_DB: chamaledger
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chamaledger"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://chamaledger:${POSTGRES_PASSWORD:-chamaledger}@db:5432/chamaledger
      ENVIRONMENT: local
      SEED_DEMO: "true"
      OTEL_ENABLED: "true"
      OTEL_ENDPOINT: http://otel-collector:4318
      SERVICE_VERSION: ${SERVICE_VERSION:-local}
      OPS_TOKEN: ${OPS_TOKEN:-local-ops-token}
      CHAOS_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      otel-collector:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

  responder:
    build: ./responder
    environment:
      API_URL: http://api:8000
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      OPS_TOKEN: ${OPS_TOKEN:-local-ops-token}
      RESPONDER_TOKEN: ${RESPONDER_TOKEN:-local-responder-token}
      LLM_BASE_URL: ${RESPONDER_LLM_BASE_URL:-}
      LLM_API_KEY: ${RESPONDER_LLM_API_KEY:-}
      LLM_MODEL: ${RESPONDER_LLM_MODEL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-}
    ports:
      - "8100:8100"
    depends_on:
      api:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./ops/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 3s
      timeout: 3s
      retries: 30

  alertmanager:
    image: prom/alertmanager:v0.27.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf %s "$$RESPONDER_TOKEN" > /tmp/responder-token
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/tmp/alertmanager
    environment:
      RESPONDER_TOKEN: ${RESPONDER_TOKEN:-local-responder-token}
    volumes:
      - ./ops/alertmanager:/etc/alertmanager:ro
    ports:
      - "9093:9093"

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./ops/loki/config.yaml:/etc/loki/config.yaml:ro
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 3s
      timeout: 3s
      retries: 40

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/config.yaml"]
    user: "0"
    volumes:
      - ./ops/tempo/config.yaml:/etc/tempo/config.yaml:ro
    ports:
      - "3200:3200"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/journey.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy

volumes:
  db-data:
  prometheus-data:
