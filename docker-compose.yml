name: chamaledger

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chamaledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chamaledger}
      POSTGRES_DB: chamaledger
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chamaledger"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://chamaledger:${POSTGRES_PASSWORD:-chamaledger}@db:5432/chamaledger
      ENVIRONMENT: local
      SEED_DEMO: "true"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
